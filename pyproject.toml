[build-system]
requires = ["setuptools>=77.0.3", "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "allomt"
dynamic = ["version"]
description = "Prediction and characterization of allosteric mechanisms"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Source = "https://github.com/uibcdf/allomt"
Issues = "https://github.com/uibcdf/allomt/issues"
"Developer guide" = "https://github.com/uibcdf/allomt/tree/main/devguide"

[tool.versioningit]
default-version = "0.1.0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.1.0"

[tool.versioningit.tag2version]
regex = '^(?P<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
require-match = true

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-receptor==1.1.0",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
extend-exclude = [
  "MOLSYSSUITE_GUIDE.md",
  "SMONITOR_GUIDE.md",
  "ARGDIGEST_GUIDE.md",
  "DEPDIGEST_GUIDE.md",
  "PYUNITWIZARD_GUIDE.md",
  "ACKREDIT_GUIDE.md",
  "PYTEST_RECEPTOR_GUIDE.md",
  "GH_RUN_RECEPTOR_GUIDE.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
