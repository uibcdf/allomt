name: MolSysSuite policy

on:
  # Admission is published; official current-policy receiving remains allomt#1.
  # Restore automatic starter triggers through the supported immutable-input route.
  workflow_dispatch:
    inputs:
      admission_sha:
        description: Published central main commit admitting uibcdf/allomt
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    uses: uibcdf/molsyssuite/.github/workflows/check-python-repository.yaml@policy-v1.5.12
    with:
      admission_sha: ${{ inputs.admission_sha }}
